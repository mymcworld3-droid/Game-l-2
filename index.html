<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Game-l-2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;touch-action:none;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}.stick{position:absolute;left:22px;bottom:22px;width:144px;height:144px;border-radius:50%;background:#ffffff1c;border:2px solid #ffffff55;pointer-events:auto}.knob{position:absolute;left:39px;top:39px;width:62px;height:62px;border-radius:50%;background:#ffffff99;border:2px solid #fff}.attack{position:absolute;right:26px;bottom:30px;width:104px;height:104px;border-radius:50%;background:#d94d5b99;border:3px solid #fff;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;pointer-events:auto}.bar{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:min(360px,60vw);height:15px;background:#0008;border:2px solid #fff5;border-radius:10px;overflow:hidden}.bar i{display:block;width:100%;height:100%;background:#55d66f}.coins{position:absolute;top:40px;left:50%;transform:translateX(-50%);color:#ffe47a;font-weight:800;text-shadow:0 2px 4px #000}</style></head><body><canvas id="game"></canvas><div id="ui"><div class="bar"><i id="hp"></i></div><div class="coins">🪙 <span id="coin">0</span></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="attack" id="attack">攻擊</div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,D;function resize(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const p={x:0,y:0,hp:100,atk:0,dx:1,dy:0,walk:0};let coins=0;const es=[],drops=[];for(let i=0;i<12;i++)es.push({x:(Math.random()-.5)*1100,y:(Math.random()-.5)*800,hp:60,dead:false,death:0,hit:0});let jx=0,jy=0,drag=false,pid=0;const st=document.getElementById('stick'),kn=document.getElementById('knob');function joy(e){const r=st.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,n=Math.hypot(x,y)||1,m=Math.min(n,48);jx=x/n*m/48;jy=y/n*m/48;kn.style.transform=`translate(${x/n*m}px,${y/n*m}px)`}st.onpointerdown=e=>{drag=true;pid=e.pointerId;st.setPointerCapture(pid);joy(e)};st.onpointermove=e=>drag&&e.pointerId===pid&&joy(e);function end(){drag=false;jx=jy=0;kn.style.transform='translate(0,0)'}st.onpointerup=end;st.onpointercancel=end;
document.getElementById('attack').onpointerdown=()=>{p.atk=.3;for(const e of es){if(e.dead)continue;const dx=e.x-p.x,dy=e.y-p.y;if(Math.hypot(dx,dy)<135){e.hp-=35;e.hit=.18;if(e.hp<=0){e.dead=true;drops.push({x:e.x,y:e.y,life:10,b:Math.random()*7})}}}};
function S(x,y){return{x:W/2+(x-p.x),y:H*.56+(y-p.y)*.72}}
function player(){const s=S(0,0),moving=Math.hypot(jx,jy)>.05,step=moving?Math.sin(p.walk*14)*5:0,flip=p.dx<0?-1:1;ctx.save();ctx.translate(s.x,s.y);ctx.scale(flip,1);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,22,29,10,0,0,7);ctx.fill();ctx.fillStyle='#4e91ed';ctx.beginPath();ctx.ellipse(0,-12,25,36,0,0,7);ctx.fill();ctx.fillStyle='#e8f5ff';ctx.beginPath();ctx.arc(0,-42,16,0,7);ctx.fill();ctx.fillStyle='#182333';ctx.beginPath();ctx.arc(0,-48,18,Math.PI,7);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(12,-10+step);ctx.lineTo(28,9-step);ctx.stroke();ctx.strokeStyle='#d8e2ec';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(27,8-step);ctx.lineTo(50,22-step);ctx.stroke();if(p.atk>0){ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.beginPath();ctx.arc(35,-14,65,-1.25,1.25);ctx.stroke()}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#29445a');g.addColorStop(.5,'#1f3b2b');g.addColorStop(1,'#14251c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H*.56);ctx.scale(1,.72);ctx.strokeStyle='#ffffff0d';for(let x=-1500;x<1500;x+=80){ctx.beginPath();ctx.moveTo(x,-1200);ctx.lineTo(x,1200);ctx.stroke()}for(let y=-1200;y<1200;y+=80){ctx.beginPath();ctx.moveTo(-1500,y);ctx.lineTo(1500,y);ctx.stroke()}ctx.restore();for(let i=-6;i<=6;i++){let x=i*170+60,y=-180+Math.sin(i*2)*80,s=S(x,y);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(s.x,s.y+18,27,10,0,0,7);ctx.fill();ctx.fillStyle='#6b432d';ctx.fillRect(s.x-8,s.y-12,16,32);ctx.fillStyle='#2f7b4c';ctx.beginPath();ctx.arc(s.x,s.y-28,32,0,7);ctx.arc(s.x-22,s.y-12,23,0,7);ctx.arc(s.x+22,s.y-12,23,0,7);ctx.fill()}for(const d of drops){if(d.life<=0)continue;let s=S(d.x,d.y),b=Math.sin(performance.now()/180+d.b)*4;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(s.x,s.y+8,13,5,0,0,7);ctx.fill();ctx.fillStyle='#ffd83d';ctx.beginPath();ctx.arc(s.x,s.y-5+b,10,0,7);ctx.fill()}for(const e of es){let s=S(e.x,e.y);if(e.dead){if(e.death>1)continue;let k=1-e.death;ctx.globalAlpha=k;ctx.fillStyle='#b64c57';ctx.beginPath();ctx.ellipse(s.x,s.y-10*k,23*k,30*k,0,0,7);ctx.fill();ctx.globalAlpha=1;continue}let z=Math.max(.65,1-(e.y-p.y)/1800);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(s.x,s.y+13*z,24*z,8*z,0,0,7);ctx.fill();ctx.fillStyle=e.hit>0?'#fff':'#b64c57';ctx.beginPath();ctx.arc(s.x,s.y-10*z,23*z,0,7);ctx.fill();ctx.fillStyle='#ffd46b';ctx.beginPath();ctx.arc(s.x-8*z,s.y-15*z,4*z,0,7);ctx.arc(s.x+8*z,s.y-15*z,4*z,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(s.x-21*z,s.y-42*z,42*z,5);ctx.fillStyle='#58d56b';ctx.fillRect(s.x-21*z,s.y-42*z,42*z*(e.hp/60),5)}player()}
let last=performance.now();function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;if(Math.hypot(jx,jy)>.05){p.x+=jx*230*dt;p.y+=jy*230*dt;p.dx=jx;p.dy=jy;p.walk+=dt}else p.walk+=dt*.2;p.atk=Math.max(0,p.atk-dt);for(const e of es){if(e.dead){e.death+=dt;continue}e.hit=Math.max(0,e.hit-dt);let dx=p.x-e.x,dy=p.y-e.y,n=Math.hypot(dx,dy)||1;if(n>55){e.x+=dx/n*48*dt;e.y+=dy/n*48*dt}else p.hp=Math.max(0,p.hp-8*dt)}for(const d of drops){d.life-=dt;if(Math.hypot(p.x-d.x,p.y-d.y)<55){coins++;d.life=0}}document.getElementById('hp').style.width=p.hp+'%';document.getElementById('coin').textContent=coins;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
