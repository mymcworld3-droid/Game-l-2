<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>史萊姆 Sprite 素材生成器 (右鍵另存版)</title>
    <style>
        body {
            background-color: #263746; 
            color: white;
            font-family: system-ui, sans-serif;
            padding: 40px;
        }
        .container {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 12px;
        }
        /* 替圖片加上虛線外框，方便看清楚邊界 */
        img {
            border: 1px dashed rgba(255,255,255,0.4);
            margin-right: 20px;
        }
        /* 隱藏原本的 Canvas，只顯示轉換後的圖片 */
        canvas {
            display: none;
        }
        p.hint {
            color: #f39c12;
            font-weight: bold;
            margin: 5px 0 0 0;
        }
    </style>
</head>
<body>

    <h1>🛠️ 史萊姆 Sprite 素材匯出工具</h1>
    <p>因為部分瀏覽器會阻擋自動下載，請直接在下方的圖案上<b>「按滑鼠右鍵」</b>或<b>「手機長按」</b>，選擇<b>「另存圖片」</b>。</p>

    <div class="container">
        <canvas id="canvasBody" width="70" height="56"></canvas>
        <img id="imgBody" alt="史萊姆身體" />
        <div>
            <h3>1. 史萊姆身體</h3>
            <p class="hint">👉 右鍵另存為 slime_body.png</p>
        </div>
    </div>

    <div class="container">
        <canvas id="canvasEye" width="12" height="12"></canvas>
        <img id="imgEye" alt="史萊姆眼睛" />
        <div>
            <h3>2. 眼睛</h3>
            <p class="hint">👉 右鍵另存為 slime_eye.png</p>
        </div>
    </div>

    <div class="container">
        <canvas id="canvasHand" width="20" height="20"></canvas>
        <img id="imgHand" alt="史萊姆手部" />
        <div>
            <h3>3. 手部</h3>
            <p class="hint">👉 右鍵另存為 slime_hand.png</p>
        </div>
    </div>

    <script>
        // 💡 如果你想換成你照片中的「藍色史萊姆」，請把填色改為：
        // 身體與手 fillStyle: "#5dade2"
        // 邊框 strokeStyle: "#2874a6"

        // 1. 繪製身體並轉換成圖片
        const canvasBody = document.getElementById("canvasBody");
        const ctxBody = canvasBody.getContext("2d");
        ctxBody.fillStyle = "#4ade80"; 
        ctxBody.strokeStyle = "#166534"; 
        ctxBody.lineWidth = 4;
        ctxBody.beginPath();
        ctxBody.ellipse(35, 28, 31, 24, 0, 0, Math.PI * 2);
        ctxBody.fill();
        ctxBody.stroke();
        document.getElementById("imgBody").src = canvasBody.toDataURL("image/png");

        // 2. 繪製眼睛並轉換成圖片
        const canvasEye = document.getElementById("canvasEye");
        const ctxEye = canvasEye.getContext("2d");
        ctxEye.fillStyle = "#10251a";
        ctxEye.beginPath();
        ctxEye.arc(6, 6, 4, 0, Math.PI * 2); 
        ctxEye.fill();
        document.getElementById("imgEye").src = canvasEye.toDataURL("image/png");

        // 3. 繪製手並轉換成圖片
        const canvasHand = document.getElementById("canvasHand");
        const ctxHand = canvasHand.getContext("2d");
        ctxHand.fillStyle = "#4ade80";
        ctxHand.strokeStyle = "#166534";
        ctxHand.lineWidth = 2;
        ctxHand.beginPath();
        ctxHand.arc(10, 10, 6, 0, Math.PI * 2); 
        ctxHand.fill();
        ctxHand.stroke();
        document.getElementById("imgHand").src = canvasHand.toDataURL("image/png");
    </script>

</body>
</html>
