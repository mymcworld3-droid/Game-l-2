<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠色史萊姆 Sprite 素材生成器 (8 倍放大版)</title>
    <style>
        body {
            background-color: #263746; 
            color: white;
            font-family: system-ui, sans-serif;
            padding: 40px;
        }
        .container {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 12px;
            flex-wrap: wrap;
        }
        img {
            border: 1px dashed rgba(255,255,255,0.4);
            margin-right: 20px;
            background: rgba(255,255,255,0.05); 
            max-width: 100%;
            height: auto;
        }
        canvas {
            display: none;
        }
        p.hint {
            color: #4ade80;
            font-weight: bold;
            margin: 5px 0 0 0;
        }
    </style>
</head>
<body>

    <h1>🟩 綠色史萊姆 Sprite 素材匯出 (8倍 高畫質版)</h1>
    <p>已經改回綠色，且<b>兩顆眼睛已合併在同一張圖</b>。請在下方圖案上<b>「按滑鼠右鍵」</b>，選擇<b>「另存圖片」</b>。</p>

    <div class="container">
        <canvas id="canvasBody" width="560" height="448"></canvas>
        <img id="imgBody" alt="史萊姆身體" />
        <div>
            <h3>1. 史萊姆身體</h3>
            <p class="hint">👉 右鍵另存為 slime_body.png</p>
        </div>
    </div>

    <div class="container">
        <canvas id="canvasEye" width="304" height="96"></canvas>
        <img id="imgEye" alt="史萊姆雙眼" />
        <div>
            <h3>2. 雙眼 (合併版)</h3>
            <p class="hint">👉 右鍵另存為 slime_eyes.png</p>
        </div>
    </div>

    <div class="container">
        <canvas id="canvasHand" width="160" height="160"></canvas>
        <img id="imgHand" alt="史萊姆手部" />
        <div>
            <h3>3. 手部</h3>
            <p class="hint">👉 右鍵另存為 slime_hand.png</p>
        </div>
    </div>

    <script>
        const SCALE = 8; // 放大 8 倍

        // 1. 繪製身體 (原味綠色)
        const canvasBody = document.getElementById("canvasBody");
        const ctxBody = canvasBody.getContext("2d");
        const cxBody = canvasBody.width / 2;
        const cyBody = canvasBody.height / 2;

        ctxBody.fillStyle = "#4ade80";     // 經典綠色
        ctxBody.strokeStyle = "#166534";   // 深綠邊框
        ctxBody.lineWidth = 4 * SCALE;
        ctxBody.beginPath();
        ctxBody.ellipse(cxBody, cyBody, 31 * SCALE, 24 * SCALE, 0, 0, Math.PI * 2);
        ctxBody.fill();
        ctxBody.stroke();
        document.getElementById("imgBody").src = canvasBody.toDataURL("image/png");

        // 2. 繪製雙眼 (兩顆放在一起)
        const canvasEye = document.getElementById("canvasEye");
        const ctxEye = canvasEye.getContext("2d");
        const cxEye = canvasEye.width / 2;
        const cyEye = canvasEye.height / 2;

        ctxEye.fillStyle = "#10251a";
        
        // 左眼 (中心向左偏移 13 * SCALE)
        ctxEye.beginPath();
        ctxEye.arc(cxEye - 13 * SCALE, cyEye, 4 * SCALE, 0, Math.PI * 2); 
        ctxEye.fill();

        // 右眼 (中心向右偏移 13 * SCALE)
        ctxEye.beginPath();
        ctxEye.arc(cxEye + 13 * SCALE, cyEye, 4 * SCALE, 0, Math.PI * 2); 
        ctxEye.fill();
        
        document.getElementById("imgEye").src = canvasEye.toDataURL("image/png");

        // 3. 繪製手 (原味綠色)
        const canvasHand = document.getElementById("canvasHand");
        const ctxHand = canvasHand.getContext("2d");
        const cxHand = canvasHand.width / 2;
        const cyHand = canvasHand.height / 2;

        ctxHand.fillStyle = "#4ade80";   // 經典綠色
        ctxHand.strokeStyle = "#166534"; // 深綠邊框
        ctxHand.lineWidth = 2 * SCALE;
        ctxHand.beginPath();
        ctxHand.arc(cxHand, cyHand, 6 * SCALE, 0, Math.PI * 2); 
        ctxHand.fill();
        ctxHand.stroke();
        document.getElementById("imgHand").src = canvasHand.toDataURL("image/png");
    </script>

</body>
</html>
