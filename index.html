<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Game-l-2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101722;touch-action:none;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}.stick{position:absolute;left:24px;bottom:24px;width:142px;height:142px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;pointer-events:auto;touch-action:none;box-shadow:inset 0 0 20px #0004}.knob{position:absolute;width:62px;height:62px;left:38px;top:38px;border-radius:50%;background:#ffffff88;border:2px solid #fff;box-shadow:0 4px 12px #0006}.attack{position:absolute;right:28px;bottom:34px;width:104px;height:104px;border-radius:50%;background:#e85b5b99;border:3px solid #fff;pointer-events:auto;display:grid;place-items:center;color:white;font-weight:800;font-size:20px;text-shadow:0 2px 4px #000}.hp{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(360px,55vw);height:16px;border-radius:10px;background:#0008;border:2px solid #fff5;overflow:hidden}.hp i{display:block;width:100%;height:100%;background:#55d66f}.hint{position:absolute;top:42px;left:50%;transform:translateX(-50%);color:#fff9;font-size:13px;text-align:center}</style>
</head>
<body>
<canvas id="game"></canvas><div id="ui"><div class="hp"><i id="hp"></i></div><div class="hint">手機：左下搖桿移動・右下攻擊</div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="attack" id="attack">攻擊</div></div>
<script>
const c=document.querySelector('#game'),ctx=c.getContext('2d');let W,H,dpr;function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const p={x:0,y:0,hp:100,atk:0};const enemies=[];for(let i=0;i<8;i++)enemies.push({x:(Math.random()-.5)*900,y:(Math.random()-.5)*700,hp:40,dead:false});
let joy={x:0,y:0},active=false,aid=null;const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');function joyMove(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=48,n=Math.hypot(dx,dy);if(n>m){dx=dx/n*m;dy=dy/n*m}joy.x=dx/m;joy.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}stick.addEventListener('pointerdown',e=>{active=true;aid=e.pointerId;stick.setPointerCapture(aid);joyMove(e)});stick.addEventListener('pointermove',e=>{if(active&&e.pointerId===aid)joyMove(e)});function joyUp(){active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',joyUp);stick.addEventListener('pointercancel',joyUp);
const attack=document.querySelector('#attack');attack.addEventListener('pointerdown',()=>{p.atk=.25;for(const e of enemies){if(e.dead)continue;let dx=e.x-p.x,dy=e.y-p.y;if(Math.hypot(dx,dy)<105)e.hp-=25;if(e.hp<=0)e.dead=true}});
function worldToScreen(x,y){const scale=1.0;return{x:W/2+(x-p.x)*scale,y:H*.54+(y-p.y)*.62}}function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#25394d');g.addColorStop(1,'#142218');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// angled 2.5D ground grid
ctx.save();ctx.translate(W/2,H*.54);ctx.scale(1,.62);ctx.strokeStyle='#ffffff10';for(let x=-1400;x<1400;x+=80){ctx.beginPath();ctx.moveTo(x,-1000);ctx.lineTo(x,1000);ctx.stroke()}for(let y=-1000;y<1000;y+=80){ctx.beginPath();ctx.moveTo(-1400,y);ctx.lineTo(1400,y);ctx.stroke()}ctx.restore();
for(const e of enemies){if(e.dead)continue;let s=worldToScreen(e.x,e.y),z=Math.max(.55,1-(e.y-p.y)/1500);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(s.x,s.y+13*z,25*z,9*z,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a94c55';ctx.beginPath();ctx.ellipse(s.x,s.y-10*z,24*z,30*z,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffdf8a';ctx.beginPath();ctx.arc(s.x-8*z,s.y-18*z,4*z,0,7);ctx.arc(s.x+8*z,s.y-18*z,4*z,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(s.x-20*z,s.y-48*z,40*z,5*z);ctx.fillStyle='#5fda69';ctx.fillRect(s.x-20*z,s.y-48*z,40*z*(e.hp/40),5*z)}
let s=worldToScreen(0,0);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(s.x,s.y+20,28,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4c8ee8';ctx.beginPath();ctx.ellipse(s.x,s.y-12,25,36,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d9f0ff';ctx.beginPath();ctx.arc(s.x,s.y-40,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText('PLAYER',s.x,s.y-62);if(p.atk>0){ctx.strokeStyle='#fff8';ctx.lineWidth=8;ctx.beginPath();ctx.arc(s.x,s.y-15,65,-1.2,1.2);ctx.stroke()}}
let last=performance.now();function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;p.x+=joy.x*230*dt;p.y+=joy.y*230*dt;p.atk=Math.max(0,p.atk-dt);for(const e of enemies){if(e.dead)continue;let dx=p.x-e.x,dy=p.y-e.y,n=Math.hypot(dx,dy);if(n>55){e.x+=dx/n*55*dt;e.y+=dy/n*55*dt}else p.hp=Math.max(0,p.hp-10*dt)}document.querySelector('#hp').style.width=p.hp+'%';draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
