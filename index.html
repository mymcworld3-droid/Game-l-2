<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Game-l-2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;touch-action:none;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}.stick{position:absolute;left:22px;bottom:22px;width:144px;height:144px;border-radius:50%;background:#ffffff1c;border:2px solid #ffffff55;pointer-events:auto}.knob{position:absolute;left:39px;top:39px;width:62px;height:62px;border-radius:50%;background:#ffffff99;border:2px solid #fff}.attack{position:absolute;right:26px;bottom:30px;width:104px;height:104px;border-radius:50%;background:#d94d5b99;border:3px solid #fff;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;pointer-events:auto}.bar{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:min(360px,60vw);height:15px;background:#0008;border:2px solid #fff5;border-radius:10px;overflow:hidden}.bar i{display:block;width:100%;height:100%;background:#55d66f}</style></head><body><canvas id="game"></canvas><div id="ui"><div class="bar"><i id="hp"></i></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="attack" id="attack">攻擊</div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,D;function resize(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const player={x:0,y:0,hp:100,attack:0,dirX:1,dirY:0};const enemies=[];for(let i=0;i<12;i++)enemies.push({x:(Math.random()-.5)*1100,y:(Math.random()-.5)*800,hp:60,dead:false});
let joyX=0,joyY=0,drag=false,pointerId=null;const stick=document.getElementById('stick'),knob=document.getElementById('knob');function updateJoy(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=48,n=Math.hypot(dx,dy)||1,m=Math.min(n,max);joyX=dx/n*m/max;joyY=dy/n*m/max;knob.style.transform=`translate(${dx/n*m}px,${dy/n*m}px)`}stick.onpointerdown=e=>{drag=true;pointerId=e.pointerId;stick.setPointerCapture(pointerId);updateJoy(e)};stick.onpointermove=e=>{if(drag&&e.pointerId===pointerId)updateJoy(e)};function endJoy(){drag=false;joyX=joyY=0;knob.style.transform='translate(0,0)'}stick.onpointerup=endJoy;stick.onpointercancel=endJoy;
document.getElementById('attack').onpointerdown=()=>{player.attack=.22;for(const e of enemies){if(e.dead)continue;const dx=e.x-player.x,dy=e.y-player.y;if(Math.hypot(dx,dy)<125)e.hp-=30;if(e.hp<=0)e.dead=true}};
function screen(x,y){return{x:W/2+(x-player.x),y:H*.56+(y-player.y)*.72}}
function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#29445a');bg.addColorStop(.5,'#1f3b2b');bg.addColorStop(1,'#14251c');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
// 2D world with a slight angled perspective: vertical screen compression only
ctx.save();ctx.translate(W/2,H*.56);ctx.scale(1,.72);ctx.strokeStyle='#ffffff0d';ctx.lineWidth=1;for(let x=-1500;x<1500;x+=80){ctx.beginPath();ctx.moveTo(x,-1200);ctx.lineTo(x,1200);ctx.stroke()}for(let y=-1200;y<1200;y+=80){ctx.beginPath();ctx.moveTo(-1500,y);ctx.lineTo(1500,y);ctx.stroke()}ctx.restore();
// trees / obstacles
for(let i=-6;i<=6;i++){const x=i*170+60,y=-180+Math.sin(i*2)*80,s=screen(x,y);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(s.x,s.y+18,27,10,0,0,7);ctx.fill();ctx.fillStyle='#6b432d';ctx.fillRect(s.x-8,s.y-12,16,32);ctx.fillStyle='#2f7b4c';ctx.beginPath();ctx.arc(s.x,s.y-28,32,0,7);ctx.fill();ctx.beginPath();ctx.arc(s.x-22,s.y-12,23,0,7);ctx.arc(s.x+22,s.y-12,23,0,7);ctx.fill()}
for(const e of enemies){if(e.dead)continue;const s=screen(e.x,e.y),depth=Math.max(.65,1-(e.y-player.y)/1800);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(s.x,s.y+13*depth,24*depth,8*depth,0,0,7);ctx.fill();ctx.fillStyle='#b64c57';ctx.beginPath();ctx.arc(s.x,s.y-10*depth,23*depth,0,7);ctx.fill();ctx.fillStyle='#ffd46b';ctx.beginPath();ctx.arc(s.x-8*depth,s.y-15*depth,4*depth,0,7);ctx.arc(s.x+8*depth,s.y-15*depth,4*depth,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(s.x-21*depth,s.y-42*depth,42*depth,5);ctx.fillStyle='#58d56b';ctx.fillRect(s.x-21*depth,s.y-42*depth,42*depth*(e.hp/60),5)}
const s=screen(0,0);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(s.x,s.y+22,29,10,0,0,7);ctx.fill();ctx.fillStyle='#4e91ed';ctx.beginPath();ctx.ellipse(s.x,s.y-12,25,36,0,0,7);ctx.fill();ctx.fillStyle='#e8f5ff';ctx.beginPath();ctx.arc(s.x,s.y-42,16,0,7);ctx.fill();ctx.fillStyle='#182333';ctx.beginPath();ctx.arc(s.x,s.y-48,18,Math.PI,7);ctx.fill();if(player.attack>0){ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.beginPath();ctx.arc(s.x+player.dirX*28,s.y-14,62,-1.1,1.1);ctx.stroke()}}
let last=performance.now();function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;const len=Math.hypot(joyX,joyY);if(len>.05){player.x+=joyX*230*dt;player.y+=joyY*230*dt;player.dirX=joyX;player.dirY=joyY}player.attack=Math.max(0,player.attack-dt);for(const e of enemies){if(e.dead)continue;const dx=player.x-e.x,dy=player.y-e.y,n=Math.hypot(dx,dy)||1;if(n>55){e.x+=dx/n*48*dt;e.y+=dy/n*48*dt}else player.hp=Math.max(0,player.hp-8*dt)}document.getElementById('hp').style.width=player.hp+'%';draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
